<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B6E99">
  <!-- 휴대폰이 다크 모드여도 색을 자동으로 어둡게 바꾸지 않게 (밝은 화면 전용) -->
  <meta name="color-scheme" content="only light">
  <meta name="apple-mobile-web-app-title" content="구구단 어항">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>구구단 아쿠아리움</title>
  <meta name="description" content="아빠가 아들을 위해 만든, 물고기 키우며 배우는 구구단 게임. 세상 모든 아이들이 구구단을 쉽고 재미있게 배우길 바라요.">
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <!-- 세로로 든 스마트폰에서만 보여요 (태블릿·PC는 안 보여요) -->
    <div id="rotate-hint">
      <div class="rotate-phone">📱</div>
      <p>휴대폰을 옆으로 돌려 주세요!</p>
      <button id="go-landscape" hidden>가로로 크게 보기</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
